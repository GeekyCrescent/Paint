# DOSBox Configuration File for Paint
# Place this file in the Paint directory and run: dosbox -conf dosbox-paint.conf

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100

[joystick]
joysticktype=auto

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
# Mount the Paint directory
@echo off
echo.
echo ================================================
echo   Paint for DOS - DOSBox Configuration
echo ================================================
echo.
mount c .
c:
echo Mounted C: drive to current directory
echo.
echo To run Paint, type: cd bin
echo                      paint.exe
echo.
echo Controls:
echo   L,S,R,C,T - Drawing tools
echo   K,W,G,B,R,Y - Colors
echo   U - Clear screen
echo   ESC - Exit
echo.
