# DOSBox Configuration for MDFourier DOS
# Save as dosbox-mdf.conf and run: dosbox -conf dosbox-mdf.conf

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100

[joystick]
joysticktype=auto

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
@echo off
echo.
echo =================================================
echo   MDFourier for DOS
echo   http://junkerhq.net/MDFourier/
echo =================================================
echo.
echo Mounting current directory as C:
mount c .
c:
echo.
echo To run MDFourier:
echo   cd bin
echo   mdf.exe
echo.
echo Controls:
echo   SPACE - Run full MDFourier test
echo   ESC   - Run PCM playback test only
echo.
echo Make sure sweep.pcm is in the bin directory!
echo.
